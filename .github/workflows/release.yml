name: Release & PyPI Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build and Publish Release to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write  # Required for OIDC PyPI trusted publishing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build wheel twine

      - name: Verify release tag matches package metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          source = pathlib.Path("llmslim/__init__.py").read_text()
          assert os.environ["RELEASE_TAG"] == "v" + version
          assert re.search(r'__version__ = "' + re.escape(version) + r'"', source)
          PY

      - name: Build Source Distribution and Wheel
        run: python -m build

      - name: Verify Package Distribution Artifacts
        run: twine check dist/*

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Uses OpenID Connect (OIDC) trusted publishing configured on PyPI.
          # Fallback configuration: If token authentication is required, set PYPI_API_TOKEN in GitHub Repository Secrets
          # password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Attach Release Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
