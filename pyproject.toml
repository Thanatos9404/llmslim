[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmslim"
version = "0.12.0"
description = "Context compression and planning for RAG and AI agents: fit retrieved documents, chat history and tool output into a token budget."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Yashvardhan Thanvi", email = "thanatos9404@users.noreply.github.com" }]
keywords = [
    "llm",
    "prompt-compression",
    "context-compression",
    "prompt-engineering",
    "token-optimization",
    "rag",
    "reranker",
    "agents",
    "langchain",
    "llamaindex",
    "haystack",
    "nlp",
    "summarization",
    "openai",
    "anthropic",
    "gemini",
    "context-window",
    "context-planning",
    "cost-optimization",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.21",
    "scikit-learn>=1.0",
    "jsonschema>=4.18",
]

[project.optional-dependencies]
semantic = ["sentence-transformers>=2.2"]
mcp = ["mcp>=2.0,<3", "httpx2>=2.5,<3", "tiktoken>=0.5"]
# llmslim serve: the HTTP API for memory and context.
server = ["starlette>=0.40", "uvicorn>=0.30", "tiktoken>=0.5"]
# PostgresStore for llmslim.memory (and llmslim serve / mcp with --db postgresql://...).
postgres = ["psycopg[binary]>=3.2,<4", "psycopg-pool>=3.2,<4"]
# llmslim proxy / llmslim wrap: the local tool-output proxy for coding agents.
proxy = ["starlette>=0.40", "uvicorn>=0.30", "httpx>=0.27,<1", "tiktoken>=0.5"]
agents = ["openai-agents>=0.11,<1", "mcp>=2.0,<3", "httpx2>=2.5,<3"]
sarvam = ["sarvamai>=0.1.34,<0.2"]
zoho = ["httpx>=0.27,<1"]
# The Exa web-search source calls Exa's REST API over httpx; no vendor SDK.
exa = ["httpx>=0.27,<1"]
neo4j = ["neo4j>=5.20,<7"]
mongodb = ["pymongo>=4.13,<5"]
fast-tokens = ["tiktoken>=0.5"]
nlp = ["nltk>=3.8"]
structured = ["pyyaml>=6.0"]
# Framework adapters in llmslim.integrations.
langchain = ["langchain-core>=0.3"]
# LLMSlimToolOutputMiddleware for LangChain 1.x agents (create_agent).
langchain-agents = ["langchain>=1.0,<2"]
llamaindex = ["llama-index-core>=0.12"]
haystack = ["haystack-ai>=2.0"]
# Agent-framework adapters (pydantic-ai-slim 2.55 needs Python 3.11+). gptme is not in "all"
# because it pins mcp<2 and the mcp extra needs mcp>=2. There is no Hermes Agent extra: current
# Hermes is installed with its own installer (it refuses to build wheels, and hermes-agent on PyPI
# is an old 0.19 release), and its context engine needs nothing beyond llmslim installed in
# Hermes's environment.
gptme = ["gptme>=0.34"]
pydantic-ai = ["pydantic-ai-slim>=1.0"]
transformers-cache = ["transformers>=4.53,<6", "torch>=2.0"]
all = [
    "sentence-transformers>=2.2",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
    "starlette>=0.40",
    "uvicorn>=0.30",
    "mcp>=2.0,<3",
    "httpx2>=2.5,<3",
    "openai-agents>=0.11,<1",
    "sarvamai>=0.1.34,<0.2",
    "httpx>=0.27,<1",
    "pymongo>=4.13,<5",
    "tiktoken>=0.5",
    "nltk>=3.8",
    "pyyaml>=6.0",
    "langchain-core>=0.3",
    "langchain>=1.0,<2",
    "llama-index-core>=0.12",
    "haystack-ai>=2.0",
    "neo4j>=5.20,<7",
    "pydantic-ai-slim>=1.0",
]
# griffe reads the source for the API reference (scripts/api_reference.py); pinned so its output is stable.
dev = ["pytest>=7.0", "pytest-cov", "ruff==0.17.2", "mypy>=1.8", "build>=1.0", "griffe==2.3.0"]

[project.urls]
Homepage = "https://www.llmslim.app"
Documentation = "https://www.llmslim.app"
Repository = "https://github.com/Thanatos9404/llmslim"
"Bug Tracker" = "https://github.com/Thanatos9404/llmslim/issues"

[project.scripts]
llmslim = "llmslim.cli:main"

# Discovered by gptme (0.34+) and Hermes Agent when they are installed; inert otherwise. gptme
# loads the provider when it first looks one up, and the plugin at startup; the plugin replaces
# gptme's compaction only with "[plugin.llmslim] compaction = true". Hermes loads entry-point
# plugins only when they are listed in plugins.enabled.
[project.entry-points."gptme.context_providers"]
llmslim = "llmslim.integrations.gptme:LLMSlimContextProvider"

[project.entry-points."gptme.plugins"]
llmslim = "llmslim.integrations.gptme_plugin:plugin"

[project.entry-points."hermes_agent.plugins"]
llmslim = "llmslim.integrations.hermes"

[tool.setuptools.packages.find]
include = ["llmslim*"]

[tool.setuptools.package-data]
llmslim = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=llmslim --cov-report=term-missing --cov-report=html --cov-report=xml --cov-fail-under=90"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["llmslim"]
branch = true
# The framework adapters import their framework at module import time and their tests skip when it
# is missing, so measuring them would make the coverage gate depend on which optional extras are
# installed. Their framework-free logic lives in llmslim/integrations/_documents.py (LangChain,
# LlamaIndex, Haystack) and llmslim/integrations/_history.py (gptme, Hermes Agent, Pydantic AI),
# which are measured and tested everywhere.
omit = [
    "tests/*",
    "benchmarks/*",
    "llmslim/integrations/langchain.py",
    "llmslim/integrations/langchain_agents.py",
    "llmslim/integrations/llama_index.py",
    "llmslim/integrations/haystack.py",
    "llmslim/integrations/gptme.py",
    "llmslim/integrations/gptme_plugin.py",
    "llmslim/integrations/hermes.py",
    "llmslim/integrations/pydantic_ai.py",
]

[tool.coverage.report]
show_missing = true
precision = 2
fail_under = 90.0
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ['py310']
include = '\.pyi?$'

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["llmslim", "tests", "benchmarks"]
exclude = ["notebooks", "venv", ".venv", "dist"]
# ruff 0.16 also formats Python blocks inside Markdown; README and docs examples are
# formatted by hand for readability, so keep Markdown out of ruff.
extend-exclude = ["*.md", "benchmarks/live/round3/vendor"]  # vendor: third-party prompts kept verbatim

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "C",   # convention
    "B",   # flake8-bugbear
]
ignore = [
    "E501", # line too long (handled by black)
    "B008", # do not perform function calls in argument defaults
    "E402", # module level import not at top of file
    "C901", # function complexity
    "W291", # trailing whitespace in templates
    "B905", # zip() without strict=: checked from py310; existing calls are not rewritten for it
]


[tool.ruff.lint.per-file-ignores]
# Research scripts for the real-model benchmarks: one-letter loop names, inline lambdas called on the spot.
"benchmarks/live/*" = ["E741", "E731", "B023"]

[tool.ruff.lint.isort]
known-first-party = ["llmslim", "benchmarks", "scripts"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "nltk.*",
    "sklearn.*",
    "sentence_transformers.*",
    "tiktoken.*",
    "yaml.*",
    "agents.*",
    "openai.*",
    "httpx2.*",
    "mcp.*",
    "langchain_core.*",
    "llama_index.*",
    "haystack.*",
    "gptme.*",
    "pydantic_ai.*",
    "agent.*",
    "hermes_cli.*",
]
ignore_missing_imports = true


