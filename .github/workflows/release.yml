name: Release & PyPI Publish

# On a published GitHub release: build the wheel and sdist once, write a CycloneDX SBOM of the runtime dependencies,
# attest both (SLSA build provenance and an SBOM attestation, signed through Sigstore), publish to PyPI with PyPI
# attestations, and attach the files to the release.
#
# On a pull request that touches packaging, or when run by hand, only the build job runs: the same build and SBOM
# steps, checked, with nothing attested, published or attached.

on:
  release:
    types: [published]
  pull_request:
    branches: [main, master]
    paths:
      - ".github/workflows/release.yml"
      - "pyproject.toml"
      - "MANIFEST.in"
      - "llmslim/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build distributions and SBOM
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip build wheel twine "cyclonedx-bom==7.6.0"

      - name: Read the package version
        id: version
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify release tag matches package metadata
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os, pathlib, re, tomllib
          version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
          source = pathlib.Path("llmslim/__init__.py").read_text()
          assert os.environ["RELEASE_TAG"] == "v" + version
          assert re.search(r'__version__ = "' + re.escape(version) + r'"', source)
          PY

      - name: Build Source Distribution and Wheel
        run: python -m build

      - name: Verify Package Distribution Artifacts
        run: twine check dist/*

      # The SBOM lists what a plain `pip install llmslim` resolved to when this release was built: the wheel is
      # installed into an empty virtual environment (pip is removed afterwards) and that environment is described.
      # Optional extras are not included.
      - name: Write the CycloneDX SBOM of the runtime dependencies
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/sbom-env"
          "$RUNNER_TEMP/sbom-env/bin/python" -m pip install --quiet dist/*.whl
          "$RUNNER_TEMP/sbom-env/bin/python" -m pip uninstall --quiet --yes pip
          mkdir -p sbom
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) cyclonedx-py environment \
            --pyproject pyproject.toml --mc-type library --output-reproducible --validate \
            --output-file "sbom/llmslim-${VERSION}.cdx.json" "$RUNNER_TEMP/sbom-env/bin/python"

      - name: Check the SBOM describes this package and its dependencies
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python - <<'PY'
          import json, os, re, tomllib
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]
          path = f"sbom/llmslim-{os.environ['VERSION']}.cdx.json"
          sbom = json.load(open(path))
          root = sbom["metadata"]["component"]
          assert (root["name"], root["version"]) == ("llmslim", project["version"]), root
          canonical = lambda name: re.sub(r"[-_.]+", "-", name).lower()
          listed = {canonical(component["name"]) for component in sbom["components"]}
          declared = {canonical(re.match(r"[A-Za-z0-9_.-]+", d)[0]) for d in project["dependencies"]}
          assert declared <= listed, f"missing from the SBOM: {sorted(declared - listed)}"
          assert "llmslim" not in listed and "pip" not in listed, sorted(listed)
          print(f"{path}: {len(listed)} components, CycloneDX {sbom['specVersion']}")
          PY

      - name: Upload the distributions and the SBOM
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            dist/
            sbom/
          if-no-files-found: error

  publish:
    name: Attest and publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write      # attach the files to the GitHub release
      id-token: write      # OIDC: PyPI trusted publishing and Sigstore signing
      attestations: write  # store the GitHub artifact attestations

    steps:
      - name: Download the distributions and the SBOM
        uses: actions/download-artifact@v8
        with:
          name: release-files

      - name: Attest build provenance of the wheel and sdist
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"

      - name: Attest the SBOM for the wheel and sdist
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"
          sbom-path: "sbom/llmslim-${{ needs.build.outputs.version }}.cdx.json"

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # OpenID Connect (OIDC) trusted publishing, configured on PyPI. It also uploads a PEP 740 attestation for
          # each file, which PyPI shows as its provenance.
          attestations: true
          skip-existing: true

      - name: Attach Release Assets to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/*
            sbom/*.cdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
