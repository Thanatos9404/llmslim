name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  web:
    name: Website lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  web-accounts:
    name: Website accounts (unit and end-to-end)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: llmslim
          POSTGRES_PASSWORD: llmslim
          POSTGRES_DB: llmslim_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llmslim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Unit tests (Vitest, in-process PGlite)
        run: npm test
      - name: Checked-in migrations match the schema
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate --name drift-check
          test -z "$(git status --porcelain -- drizzle)"
      - name: Production build with no auth variables
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright, next start, Postgres 17)
        env:
          E2E_DATABASE_URL: postgresql://llmslim:llmslim@127.0.0.1:5432/llmslim_e2e
        run: npm run test:e2e
      - name: Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: web/test-results
          retention-days: 7

  server-image:
    name: Server image builds and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t llmslim-server .
      - name: Refuse to start on a public interface without an API key
        run: |
          if docker run --rm llmslim-server; then echo "the server started without an API key"; exit 1; fi
      - name: Store and recall over HTTP with a key
        run: |
          KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          docker run -d --name llmslim -p 8080:8080 -e LLMSLIM_API_KEYS="$KEY" llmslim-server
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/info)" = 401
          curl -fsS -H "Authorization: Bearer $KEY" -H 'content-type: application/json'             -d '{"user_id": "ci", "messages": "I moved to Pune last month."}' http://127.0.0.1:8080/v1/memories
          curl -fsS -H "Authorization: Bearer $KEY" -H 'content-type: application/json'             -d '{"user_id": "ci", "query": "Where did I move to?"}' http://127.0.0.1:8080/v1/memories/search | grep -q Pune
      - name: Start MongoDB and Postgres beside the image
        env:
          # Characters a URL must escape, so the URL the image gets is escaped and both forms are looked for below.
          MONGO_PASSWORD: "img:Pa55@word/x"
        run: |
          docker network create llmslim-net
          docker run -d --name mongo --network llmslim-net \
            -e MONGO_INITDB_ROOT_USERNAME=llmslim -e MONGO_INITDB_ROOT_PASSWORD="$MONGO_PASSWORD" mongo:8.2
          docker run -d --name postgres --network llmslim-net \
            -e POSTGRES_USER=llmslim -e POSTGRES_PASSWORD=llmslim -e POSTGRES_DB=llmslim postgres:17
          for i in $(seq 1 60); do
            docker exec mongo mongosh --quiet -u llmslim -p "$MONGO_PASSWORD" --authenticationDatabase admin \
              --eval 'db.adminCommand({ping: 1}).ok' 2>/dev/null | grep -q 1 && break
            sleep 2
          done
          for i in $(seq 1 60); do docker exec postgres pg_isready -U llmslim && break; sleep 1; done
      - name: The image on MongoDB answers add, search, list and delete, through a restart and an outage
        env:
          MONGO_PASSWORD: "img:Pa55@word/x"
        run: |
          set -euo pipefail
          KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          ESCAPED=$(python3 -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["MONGO_PASSWORD"], safe=""))')
          docker run -d --name llmslim-mongo --network llmslim-net -p 8081:8080 -e LLMSLIM_API_KEYS="$KEY" \
            -e LLMSLIM_MEMORY_DB="mongodb://llmslim:${ESCAPED}@mongo:27017/llmslim?authSource=admin" llmslim-server
          api() { curl -sS --max-time 90 -H "Authorization: Bearer $KEY" -H 'content-type: application/json' "$@"; }
          stored() {
            docker exec mongo mongosh --quiet -u llmslim -p "$MONGO_PASSWORD" --authenticationDatabase admin llmslim \
              --eval 'db.llmslim_memory.countDocuments({user_id: "ci"})'
          }
          search='{"user_id": "ci", "query": "Where did I move to?"}'
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8081/healthz && break; sleep 1; done
          api -f -d '{"user_id": "ci", "messages": "I moved to Pune last month."}' http://127.0.0.1:8081/v1/memories > added.json
          ID=$(python3 -c 'import json; print(json.load(open("added.json"))["items"][0]["id"])')
          api -f -d "$search" http://127.0.0.1:8081/v1/memories/search | grep -q Pune
          api -f -d '{"user_id": "ci", "query": "Where?", "explain": true}' http://127.0.0.1:8081/v1/memories/search | grep -q explanation
          api -f "http://127.0.0.1:8081/v1/memories?user_id=ci" | grep -q "$ID"
          test "$(stored)" = 1
          echo "MongoDB restarts; the same server answers again"
          docker restart mongo
          for i in $(seq 1 30); do api -f -d "$search" http://127.0.0.1:8081/v1/memories/search > found.json && break; sleep 2; done
          grep -q Pune found.json
          echo "MongoDB is down: a 503 that names no host, URL or driver"
          docker stop mongo
          test "$(api -o down.json -w '%{http_code}' -d "$search" http://127.0.0.1:8081/v1/memories/search)" = 503
          cat down.json; echo
          python3 -c 'import json; assert json.load(open("down.json"))["error"]["type"] == "store_unavailable"'
          if grep -E -q 'mongodb|Traceback|27017|Timeout' down.json; then echo "the 503 leaks details"; exit 1; fi
          curl -fsS http://127.0.0.1:8081/healthz
          docker start mongo
          for i in $(seq 1 30); do api -f -X DELETE "http://127.0.0.1:8081/v1/memories/$ID" && break; sleep 2; done
          test "$(stored)" = 0
          docker logs llmslim-mongo > image-mongo.log 2>&1
          cat image-mongo.log
          if grep -F -q -e "$MONGO_PASSWORD" -e "$ESCAPED" image-mongo.log added.json found.json down.json; then
            echo "the MongoDB password was printed"; exit 1
          fi
          if grep -q Traceback image-mongo.log; then echo "a traceback in the server log"; exit 1; fi
          grep -q "memory store unavailable" image-mongo.log
      - name: The image on Postgres answers add, search and delete
        run: |
          set -euo pipefail
          KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          docker run -d --name llmslim-postgres --network llmslim-net -p 8082:8080 -e LLMSLIM_API_KEYS="$KEY" \
            -e LLMSLIM_MEMORY_DB="postgresql://llmslim:llmslim@postgres:5432/llmslim" llmslim-server
          api() { curl -sS --max-time 90 -H "Authorization: Bearer $KEY" -H 'content-type: application/json' "$@"; }
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8082/healthz && break; sleep 1; done
          api -f -d '{"user_id": "ci", "messages": "I moved to Pune last month."}' http://127.0.0.1:8082/v1/memories > added.json
          ID=$(python3 -c 'import json; print(json.load(open("added.json"))["items"][0]["id"])')
          api -f -d '{"user_id": "ci", "query": "Where did I move to?"}' http://127.0.0.1:8082/v1/memories/search | grep -q Pune
          api -f -X DELETE "http://127.0.0.1:8082/v1/memories/$ID" | grep -q '"deleted":1'
          test "$(docker exec postgres psql -U llmslim -tAc 'SELECT count(*) FROM llmslim_memory')" = 0
      - name: Server log
        if: always()
        run: |
          for name in llmslim llmslim-mongo llmslim-postgres; do echo "--- $name"; docker logs "$name" || true; done

  typescript-client:
    name: TypeScript client against the server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install llmslim serve for the end-to-end tests
        working-directory: .
        run: pip install -e ".[server]"
      - run: npm ci
      - run: npm run typecheck
      - name: Unit and end-to-end tests
        run: npm test
        env:
          LLMSLIM_E2E_PYTHON: python
      - run: npm run build
      - name: The built entry points import, and the package works without its optional peers
        run: |
          node --input-type=module -e "
            const { LLMSlim } = await import('llmslim');
            const { memoryTools } = await import('llmslim/ai-sdk');
            const { memoryProcessor } = await import('llmslim/mastra');
            memoryTools({ client: new LLMSlim(), userId: 'ci' });
            if (memoryProcessor({ client: new LLMSlim(), userId: 'ci' }).id !== 'llmslim-memory') process.exit(1);
          "
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/no-peers" && cd "$RUNNER_TEMP/no-peers"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/llmslim-*.tgz
          node --input-type=module -e "
            const { LLMSlim } = await import('llmslim');
            if (typeof LLMSlim !== 'function') throw new Error('llmslim has no LLMSlim export');
            for (const [entry, peer] of [['llmslim/ai-sdk', 'ai'], ['llmslim/mastra', '@mastra/core']]) {
              const error = await import(entry).then(() => null, (e) => e);
              if (error?.code !== 'ERR_MODULE_NOT_FOUND' || !error.message.includes(\"'\" + peer)) throw new Error(entry + ': ' + error);
            }
          "
      - name: The Mastra integration against the oldest supported @mastra/core
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund @mastra/core@1.11.0
          npx vitest run test/mastra.test.ts
        env:
          LLMSLIM_MASTRA_FLOOR: "1"
      - name: examples/typescript-client against the server, with the published npm package
        working-directory: examples/typescript-client
        run: |
          npm ci
          npm test

  postgres-store:
    name: Memory on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: llmslim
          POSTGRES_PASSWORD: llmslim
          POSTGRES_DB: llmslim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llmslim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install llmslim with the postgres and server extras
        run: pip install -e ".[postgres,server]" pytest httpx2
      - name: Memory tests against Postgres
        env:
          LLMSLIM_TEST_POSTGRES_URL: postgresql://llmslim:llmslim@127.0.0.1:5432/llmslim_test
        run: pytest tests/test_memory.py tests/test_memory_postgres.py -o addopts="" -q -rs

  mongodb-store:
    name: Memory on MongoDB ${{ matrix.mongodb }}${{ matrix.pymongo && format(' with pymongo {0}', matrix.pymongo) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # mongo:8.0 exits at start on the ubuntu-26.04 runners' Linux 6.19+ kernel (SERVER-121912).
        mongodb: ["6.0", "7.0", "8.2"]
        pymongo: [""]
        include:
          # The oldest PyMongo the mongodb extra allows (pymongo>=4.13,<5), on the newest server.
          - mongodb: "8.2"
            pymongo: "4.13.0"
    services:
      mongodb:
        image: mongo:${{ matrix.mongodb }}
        env:
          MONGO_INITDB_ROOT_USERNAME: llmslim
          MONGO_INITDB_ROOT_PASSWORD: llmslim
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install llmslim with the mongodb and server extras
        run: pip install -e ".[mongodb,server]" pytest httpx2
      - name: Pin PyMongo to ${{ matrix.pymongo }}
        if: matrix.pymongo
        run: |
          pip install "pymongo==${{ matrix.pymongo }}"
          python -c "import pymongo, dns.version; assert pymongo.version == '${{ matrix.pymongo }}', pymongo.version; print('pymongo', pymongo.version, 'dnspython', dns.version.version)"
      - name: Wait for the MongoDB service
        run: |
          python - <<'EOF'
          import pymongo
          url = "mongodb://llmslim:llmslim@127.0.0.1:27017/?authSource=admin"
          pymongo.MongoClient(url, serverSelectionTimeoutMS=60000).admin.command("ping")
          EOF
      - name: Memory tests against a standalone server, with authentication
        env:
          LLMSLIM_TEST_MONGODB_URL: mongodb://llmslim:llmslim@127.0.0.1:27017/llmslim_test?authSource=admin
        run: pytest tests/test_memory.py tests/test_memory_selection.py tests/test_memory_mongo.py tests/test_store_outage.py -o addopts="" -q -rs
      - name: Start a one-node replica set
        run: |
          docker run -d --name mongo-rs -p 27018:27018 mongo:${{ matrix.mongodb }} --replSet rs0 --port 27018 --bind_ip_all
          python - <<'EOF'
          import time
          import pymongo
          url = "mongodb://127.0.0.1:27018/?directConnection=true"
          client = pymongo.MongoClient(url, serverSelectionTimeoutMS=60000)
          client.admin.command("replSetInitiate", {"_id": "rs0", "members": [{"_id": 0, "host": "127.0.0.1:27018"}]})
          for _ in range(120):
              if client.admin.command("hello").get("isWritablePrimary"):
                  break
              time.sleep(0.5)
          else:
              raise SystemExit("the replica set did not elect a primary")
          EOF
      - name: Memory tests against the replica set
        env:
          LLMSLIM_TEST_MONGODB_URL: mongodb://127.0.0.1:27018/llmslim_test?replicaSet=rs0
        run: pytest tests/test_memory.py tests/test_memory_mongo.py -o addopts="" -q -rs
      - name: Replica set log
        if: failure()
        run: docker logs mongo-rs || true

  mongodb-e2e:
    name: MongoDB ${{ matrix.mongodb }} end to end from the wheel (${{ matrix.topology }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mongodb: ["6.0", "8.2"]
        topology: ["standalone with auth", "replica set"]
    env:
      # Characters a URL must escape: the tests look for both forms in everything the commands print and answer.
      MONGO_PASSWORD: "e2e:Pa55@word/x"
      VENV: ${{ github.workspace }}/../wheel-venv
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist
      - name: Install the wheel with the mongodb, server and mcp extras in a clean environment
        run: |
          python -m venv "$VENV"
          "$VENV/bin/python" -m pip install "$(ls dist/llmslim-*.whl)[mongodb,server,mcp]" pytest
          if "$VENV/bin/python" -m pip show llmslim | grep -qi "editable project location"; then exit 1; fi
      - name: Start MongoDB ${{ matrix.mongodb }} (standalone, with authentication)
        if: matrix.topology == 'standalone with auth'
        run: |
          docker run -d --name mongo-e2e -p 27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=llmslim -e MONGO_INITDB_ROOT_PASSWORD="$MONGO_PASSWORD" mongo:${{ matrix.mongodb }}
          ESCAPED=$("$VENV/bin/python" -c 'import os, urllib.parse; print(urllib.parse.quote(os.environ["MONGO_PASSWORD"], safe=""))')
          echo "LLMSLIM_TEST_MONGODB_URL=mongodb://llmslim:${ESCAPED}@127.0.0.1:27017/llmslim_e2e?authSource=admin" >> "$GITHUB_ENV"
      - name: Start MongoDB ${{ matrix.mongodb }} (a one-node replica set)
        if: matrix.topology == 'replica set'
        run: |
          docker run -d --name mongo-e2e -p 27018:27018 mongo:${{ matrix.mongodb }} --replSet rs0 --port 27018 --bind_ip_all
          "$VENV/bin/python" - <<'EOF'
          import time
          import pymongo
          client = pymongo.MongoClient("mongodb://127.0.0.1:27018/?directConnection=true", serverSelectionTimeoutMS=60000)
          client.admin.command("replSetInitiate", {"_id": "rs0", "members": [{"_id": 0, "host": "127.0.0.1:27018"}]})
          EOF
          echo "LLMSLIM_TEST_MONGODB_URL=mongodb://127.0.0.1:27018/llmslim_e2e?replicaSet=rs0" >> "$GITHUB_ENV"
          echo "LLMSLIM_E2E_BIG_IMPORT=20000" >> "$GITHUB_ENV"
      - name: Wait for MongoDB to take writes
        run: |
          "$VENV/bin/python" - <<'EOF'
          import os
          import time
          import pymongo
          for _ in range(120):
              try:
                  with pymongo.MongoClient(os.environ["LLMSLIM_TEST_MONGODB_URL"], serverSelectionTimeoutMS=2000) as client:
                      if client.admin.command("hello").get("isWritablePrimary"):
                          break
              except pymongo.errors.PyMongoError:
                  pass
              time.sleep(1)
          else:
              raise SystemExit("MongoDB did not start")
          EOF
      - name: serve, mcp, import and the chat endpoint, run from the wheel
        env:
          LLMSLIM_E2E_MONGODB_CONTAINER: mongo-e2e
        run: |
          LLMSLIM_E2E_BIN="$VENV/bin" "$VENV/bin/pytest" tests/e2e --import-mode=importlib -p no:cacheprovider \
            -o addopts="" -v -rs -s
      - name: MongoDB log
        if: failure()
        run: docker logs mongo-e2e 2>&1 | tail -200 || true

  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip build setuptools wheel
          pip install ruff==0.15.21 mypy pytest pytest-cov twine types-PyYAML
          pip install -e ".[all,dev]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Code Formatter Check
        run: ruff format --check .

      # On the oldest supported Python, so the stubs installed match mypy's python_version.
      - name: Run MyPy Type Checker
        if: matrix.python-version == '3.10' && matrix.os == 'ubuntu-latest'
        run: mypy llmslim

      - name: Run Pytest Suite with Coverage (Minimum 90%)
        run: pytest --cov=llmslim --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Run Benchmark Smoke Test
        run: python -m benchmarks.benchmark_regression

      - name: Run Phase 2 Offline Benchmark Smoke Test
        run: python -m benchmarks.run --mode fast --no-archive

      - name: Build Package Artifacts (Wheel & Sdist)
        run: python -m build

      - name: Validate Package Artifacts
        run: twine check dist/*

      - name: Verify Clean Package Installation
        run: |
          pip install dist/*.whl
          python -c "import llmslim; print(f'llmslim version: {llmslim.__version__}')"

      - name: Verify the wheel ships py.typed
        run: python -c "import glob, zipfile; assert 'llmslim/py.typed' in zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()"

      - name: Upload Coverage to Codecov (Python 3.12 only)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
