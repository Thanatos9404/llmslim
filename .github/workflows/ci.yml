name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  web:
    name: Website lint and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  web-accounts:
    name: Website accounts (unit and end-to-end)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: llmslim
          POSTGRES_PASSWORD: llmslim
          POSTGRES_DB: llmslim_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llmslim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Unit tests (Vitest, in-process PGlite)
        run: npm test
      - name: Checked-in migrations match the schema
        run: |
          npx drizzle-kit check
          npx drizzle-kit generate --name drift-check
          test -z "$(git status --porcelain -- drizzle)"
      - name: Production build with no auth variables
        run: npm run build
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright, next start, Postgres 17, least-privilege login)
        env:
          # The owner migrates and grants; the site runs as llmslim_app with production's grants
          # (scripts/db/app-role.sql), so a migration that adds a table without a grant fails here.
          E2E_DATABASE_URL: postgresql://llmslim:llmslim@127.0.0.1:5432/llmslim_e2e
          E2E_APP_DATABASE_URL: postgresql://llmslim_app:llmslim_app@127.0.0.1:5432/llmslim_e2e
        run: npm run test:e2e
      - name: Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: web/test-results
          retention-days: 7

  server-image:
    name: Server image builds and answers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t llmslim-server .
      - name: Refuse to start on a public interface without an API key
        run: |
          if docker run --rm llmslim-server; then echo "the server started without an API key"; exit 1; fi
      - name: Store and recall over HTTP with a key
        run: |
          KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')
          docker run -d --name llmslim -p 8080:8080 -e LLMSLIM_API_KEYS="$KEY" llmslim-server
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/v1/info)" = 401
          curl -fsS -H "Authorization: Bearer $KEY" -H 'content-type: application/json'             -d '{"user_id": "ci", "messages": "I moved to Pune last month."}' http://127.0.0.1:8080/v1/memories
          curl -fsS -H "Authorization: Bearer $KEY" -H 'content-type: application/json'             -d '{"user_id": "ci", "query": "Where did I move to?"}' http://127.0.0.1:8080/v1/memories/search | grep -q Pune
      - name: Server log
        if: always()
        run: docker logs llmslim || true

  typescript-client:
    name: TypeScript client against the server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install llmslim serve for the end-to-end tests
        working-directory: .
        run: pip install -e ".[server]"
      - run: npm ci
      - run: npm run typecheck
      - name: Unit and end-to-end tests
        run: npm test
        env:
          LLMSLIM_E2E_PYTHON: python
      - run: npm run build
      - name: The built entry points import, and the package works without its optional peers
        run: |
          node --input-type=module -e "
            const { LLMSlim } = await import('llmslim');
            const { memoryTools } = await import('llmslim/ai-sdk');
            const { memoryProcessor } = await import('llmslim/mastra');
            memoryTools({ client: new LLMSlim(), userId: 'ci' });
            if (memoryProcessor({ client: new LLMSlim(), userId: 'ci' }).id !== 'llmslim-memory') process.exit(1);
          "
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/no-peers" && cd "$RUNNER_TEMP/no-peers"
          npm init -y > /dev/null
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP"/llmslim-*.tgz
          node --input-type=module -e "
            const { LLMSlim } = await import('llmslim');
            if (typeof LLMSlim !== 'function') throw new Error('llmslim has no LLMSlim export');
            for (const [entry, peer] of [['llmslim/ai-sdk', 'ai'], ['llmslim/mastra', '@mastra/core']]) {
              const error = await import(entry).then(() => null, (e) => e);
              if (error?.code !== 'ERR_MODULE_NOT_FOUND' || !error.message.includes(\"'\" + peer)) throw new Error(entry + ': ' + error);
            }
          "
      - name: The Mastra integration against the oldest supported @mastra/core
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund @mastra/core@1.11.0
          npx vitest run test/mastra.test.ts
        env:
          LLMSLIM_MASTRA_FLOOR: "1"
      - name: examples/typescript-client against the server, with the published npm package
        working-directory: examples/typescript-client
        run: |
          npm ci
          npm test

  postgres-store:
    name: Memory on Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: llmslim
          POSTGRES_PASSWORD: llmslim
          POSTGRES_DB: llmslim_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U llmslim"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install llmslim with the postgres and server extras
        run: pip install -e ".[postgres,server]" pytest httpx2
      - name: Memory tests against Postgres
        env:
          LLMSLIM_TEST_POSTGRES_URL: postgresql://llmslim:llmslim@127.0.0.1:5432/llmslim_test
        run: pytest tests/test_memory.py tests/test_memory_postgres.py -o addopts="" -q -rs

  mongodb-store:
    name: Memory on MongoDB ${{ matrix.mongodb }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # mongo:8.0 exits at start on the ubuntu-26.04 runners' Linux 6.19+ kernel (SERVER-121912).
        mongodb: ["6.0", "7.0", "8.2"]
    services:
      mongodb:
        image: mongo:${{ matrix.mongodb }}
        env:
          MONGO_INITDB_ROOT_USERNAME: llmslim
          MONGO_INITDB_ROOT_PASSWORD: llmslim
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install llmslim with the mongodb and server extras
        run: pip install -e ".[mongodb,server]" pytest httpx2
      - name: Wait for the MongoDB service
        run: |
          python - <<'EOF'
          import pymongo
          url = "mongodb://llmslim:llmslim@127.0.0.1:27017/?authSource=admin"
          pymongo.MongoClient(url, serverSelectionTimeoutMS=60000).admin.command("ping")
          EOF
      - name: Memory tests against a standalone server, with authentication
        env:
          LLMSLIM_TEST_MONGODB_URL: mongodb://llmslim:llmslim@127.0.0.1:27017/llmslim_test?authSource=admin
        run: pytest tests/test_memory.py tests/test_memory_selection.py tests/test_memory_mongo.py -o addopts="" -q -rs
      - name: Start a one-node replica set
        run: |
          docker run -d --name mongo-rs -p 27018:27018 mongo:${{ matrix.mongodb }} --replSet rs0 --port 27018 --bind_ip_all
          python - <<'EOF'
          import time
          import pymongo
          url = "mongodb://127.0.0.1:27018/?directConnection=true"
          client = pymongo.MongoClient(url, serverSelectionTimeoutMS=60000)
          client.admin.command("replSetInitiate", {"_id": "rs0", "members": [{"_id": 0, "host": "127.0.0.1:27018"}]})
          for _ in range(120):
              if client.admin.command("hello").get("isWritablePrimary"):
                  break
              time.sleep(0.5)
          else:
              raise SystemExit("the replica set did not elect a primary")
          EOF
      - name: Memory tests against the replica set
        env:
          LLMSLIM_TEST_MONGODB_URL: mongodb://127.0.0.1:27018/llmslim_test?replicaSet=rs0
        run: pytest tests/test_memory.py tests/test_memory_mongo.py -o addopts="" -q -rs
      - name: Replica set log
        if: failure()
        run: docker logs mongo-rs || true

  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip build setuptools wheel
          pip install ruff==0.15.21 mypy pytest pytest-cov twine types-PyYAML
          pip install -e ".[all,dev]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Code Formatter Check
        run: ruff format --check .

      # On the oldest supported Python, so the stubs installed match mypy's python_version.
      - name: Run MyPy Type Checker
        if: matrix.python-version == '3.10' && matrix.os == 'ubuntu-latest'
        run: mypy llmslim

      - name: Run Pytest Suite with Coverage (Minimum 90%)
        run: pytest --cov=llmslim --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Run Benchmark Smoke Test
        run: python -m benchmarks.benchmark_regression

      - name: Run Phase 2 Offline Benchmark Smoke Test
        run: python -m benchmarks.run --mode fast --no-archive

      - name: Build Package Artifacts (Wheel & Sdist)
        run: python -m build

      - name: Validate Package Artifacts
        run: twine check dist/*

      - name: Verify Clean Package Installation
        run: |
          pip install dist/*.whl
          python -c "import llmslim; print(f'llmslim version: {llmslim.__version__}')"

      - name: Verify the wheel ships py.typed
        run: python -c "import glob, zipfile; assert 'llmslim/py.typed' in zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()"

      - name: Upload Coverage to Codecov (Python 3.12 only)
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
